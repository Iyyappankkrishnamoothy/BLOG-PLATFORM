<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Write Post — BlogSpace</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <a href="index.html" class="logo">📝 BlogSpace</a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <span id="navUser"></span>
      <button onclick="logout()" id="logoutBtn" style="display:none">Logout</button>
    </div>
  </nav>

  <!-- CREATE / EDIT FORM -->
  <div class="container">
    <div class="create-box">
      <h2 id="formTitle">✍️ Write a New Post</h2>
      <p id="formSubtitle" class="auth-sub">Share your thoughts with the world</p>

      <div id="formMsg" class="msg"></div>

      <label>Post Title</label>
      <input type="text" id="postTitle" placeholder="Enter a catchy title..." />

      <label>Content</label>
      <textarea id="postContent" rows="10" placeholder="Write your post content here..."></textarea>

      <div class="form-actions">
        <button class="btn" onclick="submitPost()">📤 Publish Post</button>
        <a href="index.html" class="btn btn-outline">Cancel</a>
      </div>
    </div>
  </div>

  <footer>
    <p>© 2025 BlogSpace — Built for THIRANEX Internship Task 4</p>
  </footer>

  <script src="app.js"></script>
  <script>
    const token = localStorage.getItem('token');
    const username = localStorage.getItem('username');
    const params = new URLSearchParams(window.location.search);
    const editId = params.get('id'); // if editing

    // Redirect if not logged in
    if (!token) {
      window.location.href = 'auth.html';
    }

    // Update navbar
    function updateNav() {
      if (username) {
        document.getElementById('navUser').textContent = '👤 ' + username;
        document.getElementById('logoutBtn').style.display = 'inline';
      }
    }

    // If editing, load existing post data
    async function loadEditData() {
      if (!editId) return;

      document.getElementById('formTitle').textContent = '✏️ Edit Post';
      document.getElementById('formSubtitle').textContent = 'Update your post below';
      document.querySelector('button.btn').textContent = '💾 Save Changes';

      const res = await fetch('/api/posts/' + editId);
      if (!res.ok) {
        alert('Post not found.');
        window.location.href = 'index.html';
        return;
      }

      const post = await res.json();

      // Only allow author to edit
      if (post.author !== username) {
        alert('You can only edit your own posts.');
        window.location.href = 'index.html';
        return;
      }

      document.getElementById('postTitle').value = post.title;
      document.getElementById('postContent').value = post.content;
    }

    // Submit (create or edit)
    async function submitPost() {
      const title = document.getElementById('postTitle').value.trim();
      const content = document.getElementById('postContent').value.trim();
      const msg = document.getElementById('formMsg');

      if (!title || !content) {
        msg.textContent = 'Please fill in both title and content.';
        msg.className = 'msg error';
        return;
      }

      const url = editId ? '/api/posts/' + editId : '/api/posts';
      const method = editId ? 'PUT' : 'POST';

      const res = await fetch(url, {
        method: method,
        headers: {
          'Content-Type': 'application/json',
          'Authorization': token
        },
        body: JSON.stringify({ title, content })
      });

      const data = await res.json();

      if (res.ok) {
        msg.textContent = editId ? 'Post updated!' : 'Post published!';
        msg.className = 'msg success';
        setTimeout(() => window.location.href = 'post.html?id=' + data.id, 1000);
      } else {
        msg.textContent = data.error || 'Something went wrong.';
        msg.className = 'msg error';
      }
    }

    updateNav();
    loadEditData();
  </script>
</body>
</html>
